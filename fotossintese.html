<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Fotossíntese & Respiração</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f9f6; color: #333; padding: 20px; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { color: #0e9f6e; font-size: 1.8rem; }
    .back-btn { text-decoration: none; color: #0e9f6e; font-weight: bold; display: inline-block; margin-bottom: 10px; }

    .sim-container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1000px; margin: 0 auto; }
    
    /* Painel de Controles */
    .controls { flex: 1; min-width: 280px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .control-group { margin-bottom: 20px; }
    .control-group label { display: block; font-weight: bold; margin-bottom: 8px; }
    .control-group input[type=range] { width: 100%; accent-color: #0e9f6e; }
    .val-display { float: right; color: #0e9f6e; font-weight: bold; }

    /* Área da Animação */
    .viewport { flex: 2; min-width: 320px; background: #e6f4ea; border-radius: 12px; height: 350px; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; border: 2px solid #b4fece; }
    .sun { position: absolute; top: 15px; left: 15px; width: 60px; height: 60px; background: #ffc107; border-radius: 50%; box-shadow: 0 0 20px #ffc107; transition: opacity 0.3s; }
    .leaf { font-size: 100px; z-index: 2; }
    
    /* Bolhas de O2 */
    .bubble { position: absolute; background: rgba(14, 159, 110, 0.6); border-radius: 50%; color: white; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; animation: floatUp 3s infinite linear; }
    @keyframes floatUp {
      0% { transform: translateY(50px); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-150px); opacity: 0; }
    }

    /* Painel de Resultados */
    .dashboard { width: 100%; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; justify-content: space-around; text-align: center; margin-top: 20px; }
    .stat-box { font-size: 1.2rem; font-weight: bold; }
    .stat-box span { display: block; font-size: 0.9rem; color: #666; font-weight: normal; margin-top: 4px; }
    .o2-val { color: #0e9f6e; }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Voltar aos Laboratórios</a>
  
  <div class="header">
    <h1>🌱 Fotossíntese & Respiração Celular</h1>
    <p>Ajuste as variáveis para observar a taxa de produção de oxigênio em tempo real.</p>
  </div>

  <div class="sim-container">
    <!-- Controles -->
    <div class="controls">
      <h3>Variáveis Ambientais</h3>
      <br>
      <div class="control-group">
        <label>☀️ Luz Solas: <span id="luz-val" class="val-display">50%</span></label>
        <input type="range" id="luz" min="0" max="100" value="50">
      </div>
      
      <div class="control-group">
        <label>💨 Dióxido de Carbono (CO₂): <span id="co2-val" class="val-display">50%</span></label>
        <input type="range" id="co2" min="0" max="100" value="50">
      </div>

      <div class="control-group">
        <label>💧 Água (H₂O): <span id="agua-val" class="val-display">50%</span></label>
        <input type="range" id="agua" min="0" max="100" value="50">
      </div>
    </div>

    <!-- Visualizador -->
    <div class="viewport" id="viewport">
      <div class="sun" id="sun"></div>
      <div class="leaf">🍃</div>
    </div>
  </div>

  <!-- Medidores -->
  <div class="sim-container">
    <div class="dashboard">
      <div class="stat-box">
        <div id="rate-o2" class="o2-val">0 %</div>
        <span>Taxa de Liberação de O₂</span>
      </div>
      <div class="stat-box">
        <div id="status-planta">Saudável</div>
        <span>Estado do Organismo</span>
      </div>
    </div>
  </div>

  <script>
    const luzInput = document.getElementById('luz');
    const co2Input = document.getElementById('co2');
    const aguaInput = document.getElementById('agua');

    const luzVal = document.getElementById('luz-val');
    const co2Val = document.getElementById('co2-val');
    const aguaVal = document.getElementById('agua-val');

    const sun = document.getElementById('sun');
    const rateO2Display = document.getElementById('rate-o2');
    const statusPlanta = document.getElementById('status-planta');
    const viewport = document.getElementById('viewport');

    function atualizarSimulacao() {
      const luz = parseInt(luzInput.value);
      const co2 = parseInt(co2Input.value);
      const agua = parseInt(aguaInput.value);

      // Atualizar textos dos controles
      luzVal.textContent = luz + '%';
      co2Val.textContent = co2 + '%';
      aguaVal.textContent = agua + '%';

      // Opacidade do Sol
      sun.style.opacity = luz / 100;

      // Cálculo da Taxa de Fotossíntese (baseado na menor variável / Lei dos Limites de Blackman)
      let taxa = Math.min(luz, co2, agua);
      rateO2Display.textContent = taxa + ' %';

      // Estado da Planta
      if (agua < 20) {
        statusPlanta.textContent = '🥀 Murcha (Falta de Água)';
        statusPlanta.style.color = '#e53e3e';
      } else if (luz < 10) {
        statusPlanta.textContent = '🌙 Em Respiração Apenas';
        statusPlanta.style.color = '#3182ce';
      } else {
        statusPlanta.textContent = '🌿 Fotossíntese Ativa';
        statusPlanta.style.color = '#38a169';
      }

      // Gerar bolhas de O2
      criarBolhas(taxa);
    }

    function criarBolhas(taxa) {
      // Limpa bolhas antigas
      document.querySelectorAll('.bubble').forEach(b => b.remove());

      const quantidade = Math.floor(taxa / 15);
      for (let i = 0; i < quantidade; i++) {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = 'O₂';
        bubble.style.width = (15 + Math.random() * 15) + 'px';
        bubble.style.height = bubble.style.width;
        bubble.style.left = (35 + Math.random() * 30) + '%';
        bubble.style.animationDelay = (Math.random() * 2) + 's';
        viewport.appendChild(bubble);
      }
    }

    luzInput.addEventListener('input', atualizarSimulacao);
    co2Input.addEventListener('input', atualizarSimulacao);
    aguaInput.addEventListener('input', atualizarSimulacao);

    // Inicializar
    atualizarSimulacao();
  </script>
</body>
</html>
