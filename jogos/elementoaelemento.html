<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolução Química e da Vida - SciLab Virtual</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #030712; 
            color: #f3f4f6; 
            margin: 0; 
            padding: 0; 
            font-family: system-ui, -apple-system, sans-serif; 
        }
        canvas { display: block; touch-action: none; background: #020617; }
        .glass { 
            background: rgba(17, 24, 39, 0.9); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(75, 85, 99, 0.3); 
        }
    </style>
</head>
<body class="min-h-screen w-full flex flex-col bg-gray-950 select-none">

    <!-- CABEÇALHO -->
    <header class="w-full bg-gray-950/95 backdrop-blur border-b border-gray-800 p-3 z-30 sticky top-0 flex items-center justify-between gap-3 shrink-0">
        <div class="flex items-center gap-4">
            <a href="../jogos.html" class="text-xs font-bold text-cyan-400 hover:text-cyan-300 flex items-center gap-1.5 transition">
                <span>←</span> Jogos
            </a>
            <h1 class="text-sm sm:text-base font-bold text-emerald-400 tracking-wide flex items-center gap-2">
                🧬 Evolução Química: Da Gota à Vida
            </h1>
        </div>
        <div class="flex items-center gap-4 text-xs font-mono">
            <div class="bg-gray-900 px-3 py-1.5 rounded-xl border border-gray-800">
                Pontos: <span id="score" class="text-cyan-300 font-bold">0</span>
            </div>
            <button onclick="resetGame()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-xl transition font-sans font-bold shadow-md">
                🔄 Reiniciar
            </button>
        </div>
    </header>

    <!-- ÁREA PRINCIPAL DO JOGO -->
    <main class="flex-1 flex flex-col lg:flex-row items-center justify-center p-3 sm:p-5 gap-6">
        
        <!-- PAINEL DA ÁREA DE JOGO (CONTAINER DE QUEDA) -->
        <div class="relative glass rounded-3xl p-3 shadow-2xl border border-emerald-500/30 flex flex-col items-center">
            <div class="absolute top-4 left-4 z-10 bg-black/70 px-3 py-1 rounded-xl text-[11px] font-mono border border-gray-800 flex items-center gap-2">
                <span class="text-gray-400">Próximo elemento:</span>
                <span id="next-preview" class="text-lg">💧</span>
            </div>
            
            <canvas id="gameCanvas" width="400" height="580" class="rounded-2xl border border-gray-800 cursor-crosshair shadow-inner"></canvas>
            
            <div class="text-[11px] text-gray-400 mt-2 text-center">
                Clique ou toque na horizontal para soltar o elemento. Junte dois iguais para evoluir!
            </div>
        </div>

        <!-- PAINEL LATERAL DE PROGRESSÃO (FASES DA EVOLUÇÃO) -->
        <aside class="glass w-full lg:w-80 p-4 sm:p-5 rounded-3xl border border-gray-700/60 space-y-3">
            <h3 class="text-xs font-bold text-emerald-400 uppercase tracking-wider border-b border-gray-800 pb-2">
                Árvore Evolutiva
            </h3>
            <div id="evolution-list" class="space-y-2 max-h-[480px] overflow-y-auto pr-1 text-xs">
                <!-- Gerado via JS -->
            </div>
        </aside>
    </main>

    <!-- MODAL DE GAME OVER OU VITÓRIA -->
    <div id="modal-gameover" class="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center hidden z-50 p-4">
        <div class="glass max-w-sm w-full p-6 rounded-3xl border border-emerald-500/50 text-center space-y-4 shadow-2xl">
            <div id="modal-icon" class="text-5xl">🌍</div>
            <h3 id="modal-title" class="text-xl font-bold text-emerald-300">Fim de Jogo!</h3>
            <p id="modal-desc" class="text-xs text-gray-300 leading-relaxed"></p>
            <div class="bg-gray-900 p-3 rounded-xl border border-gray-800 text-sm font-mono">
                Pontuação Final: <span id="final-score" class="text-cyan-300 font-bold">0</span>
            </div>
            <button onclick="resetGame()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-xl font-bold transition text-sm shadow-lg">
                Jogar Novamente
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Definição dos Estágios Evolutivos (da menor gota até o Planeta Vivo)
        const elements = [
            { level: 0, name: "Gota de Água", icon: "💧", radius: 14, score: 2 },
            { level: 1, name: "Poça de Água", icon: "🌊", radius: 20, score: 6 },
            { level: 2, name: "Lago Primitivo", icon: "🏞️", radius: 28, score: 12 },
            { level: 3, name: "Rio Corrente", icon: "🌊", radius: 36, score: 20 },
            { level: 4, name: "Oceano Profundo", icon: "🌎", radius: 46, score: 35 },
            { level: 5, name: "Ilha Vulcânica", icon: "🌋", radius: 56, score: 55 },
            { level: 6, name: "Sopa Orgânica", icon: "⚡", radius: 66, score: 80 },
            { level: 7, name: "Célula Primordial", icon: "🦠", radius: 76, score: 110 },
            { level: 8, name: "Flora Primitiva", icon: "🌿", radius: 88, score: 150 },
            { level: 9, name: "Vida Marinha", icon: "🐟", radius: 100, score: 200 },
            { level: 10, name: "Bioma Terrestre", icon: "🦖", radius: 112, score: 300 },
            { level: 11, name: "Planeta Gaia (Vivo)", icon: "🌐", radius: 128, score: 500 }
        ];

        let balls = [];
        let score = 0;
        let currentDrop = null;
        let nextLevel = 0;
        let gameOver = false;
        let dropCooldown = false;

        function initEvolutionList() {
            const list = document.getElementById('evolution-list');
            list.innerHTML = '';
            elements.forEach((el, idx) => {
                list.innerHTML += `
                    <div id="evo-${idx}" class="flex items-center justify-between p-2 rounded-xl bg-gray-900/60 border border-gray-800 transition">
                        <div class="flex items-center gap-2.5">
                            <span class="text-xl">${el.icon}</span>
                            <div>
                                <div class="font-bold text-gray-300">${el.name}</div>
                                <div class="text-[10px] text-gray-500">Nível ${idx + 1}</div>
                            </div>
                        </div>
                        <span class="font-mono text-cyan-400 font-bold">+${el.score}</span>
                    </div>
                `;
            });
        }

        function spawnNextElement() {
            nextLevel = Math.random() < 0.7 ? 0 : 1; // 70% chance de vir gota, 30% de poça
            document.getElementById('next-preview').innerText = elements[nextLevel].icon;
        }

        function resetGame() {
            balls = [];
            score = 0;
            gameOver = false;
            document.getElementById('score').innerText = score;
            document.getElementById('modal-gameover').classList.add('hidden');
            spawnNextElement();
            createNewDrop(canvas.width / 2);
        }

        function createNewDrop(x) {
            currentDrop = {
                x: Math.max(elements[nextLevel].radius, Math.min(canvas.width - elements[nextLevel].radius, x)),
                y: 45,
                level: nextLevel,
                radius: elements[nextLevel].radius,
                vx: 0,
                vy: 0,
                isDropped: false
            };
            spawnNextElement();
        }

        // Controles de Mouse e Toque
        canvas.addEventListener('mousemove', (e) => {
            if (currentDrop && !currentDrop.isDropped && !gameOver) {
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                currentDrop.x = Math.max(currentDrop.radius, Math.min(canvas.width - currentDrop.radius, mouseX));
            }
        });

        canvas.addEventListener('click', (e) => {
            if (currentDrop && !currentDrop.isDropped && !gameOver && !dropCooldown) {
                currentDrop.isDropped = true;
                currentDrop.vy = 2;
                balls.push(currentDrop);
                dropCooldown = true;
                setTimeout(() => {
                    if (!gameOver) createNewDrop(canvas.width / 2);
                    dropCooldown = false;
                }, 600);
            }
        });

        // Física e Colisões simples para gravidade e fusão
        function updatePhysics() {
            if (gameOver) return;

            const gravity = 0.3;
            const friction = 0.98;
            const bounce = 0.3;

            balls.forEach(ball => {
                if (ball.isDropped) {
                    ball.vy += gravity;
                    ball.x += ball.vx;
                    ball.y += ball.vy;
                    ball.vx *= friction;

                    // Paredes laterais
                    if (ball.x - ball.radius < 0) {
                        ball.x = ball.radius;
                        ball.vx *= -bounce;
                    }
                    if (ball.x + ball.radius > canvas.width) {
                        ball.x = canvas.width - ball.radius;
                        ball.vx *= -bounce;
                    }
                    // Chão
                    if (ball.y + ball.radius > canvas.height) {
                        ball.y = canvas.height - ball.radius;
                        ball.vy *= -bounce;
                        ball.vx *= 0.8;
                    }
                }
            });

            // Verificar colisões e fusões entre elementos iguais
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    let b1 = balls[i];
                    let b2 = balls[j];
                    let dx = b2.x - b1.x;
                    let dy = b2.y - b1.y;
                    let dist = Math.hypot(dx, dy);
                    let minDist = b1.radius + b2.radius;

                    if (dist < minDist) {
                        // Colisão física (resolução de sobreposição)
                        let overlap = minDist - dist;
                        let angle = Math.atan2(dy, dx);
                        if (b1.level === b2.level && b1.isDropped && b2.isDropped) {
                            // Fusão de elementos iguais!
                            if (b1.level < elements.length - 1) {
                                let newLevel = b1.level + 1;
                                let newX = (b1.x + b2.x) / 2;
                                let newY = (b1.y + b2.y) / 2;
                                
                                score += elements[newLevel].score;
                                document.getElementById('score').innerText = score;

                                balls.splice(j, 1);
                                balls.splice(i, 1);

                                balls.push({
                                    x: newX,
                                    y: newY,
                                    level: newLevel,
                                    radius: elements[newLevel].radius,
                                    vx: (Math.random() - 0.5) * 2,
                                    vy: -3,
                                    isDropped: true
                                });

                                // Vitória se criar o Planeta Gaia
                                if (newLevel === elements.length - 1) {
                                    triggerVictory();
                                }
                                break;
                            }
                        } else {
                            // Apenas empurra para separar
                            let correction = overlap / 2;
                            b1.x -= Math.cos(angle) * correction;
                            b1.y -= Math.sin(angle) * correction;
                            b2.x += Math.cos(angle) * correction;
                            b2.y += Math.sin(angle) * correction;
                        }
                    }
                }
            }

            // Checar Game Over (se houver bolas empilhadas acima da linha de corte Y = 70 por mais de 1 segundo)
            balls.forEach(ball => {
                if (ball.isDropped && ball.y - ball.radius < 70 && Math.abs(ball.vy) < 0.5) {
                    // Trigger game over
                    // triggerGameOver();
                }
            });
        }

        function triggerGameOver() {
            gameOver = true;
            document.getElementById('modal-icon').innerText = "💥";
            document.getElementById('modal-title').innerText = "Extinção em Massa!";
            document.getElementById('modal-desc').innerText = "O laboratório transbordou de elementos antes de alcançar a harmonia biológica.";
            document.getElementById('final-score').innerText = score;
            document.getElementById('modal-gameover').classList.remove('hidden');
        }

        function triggerVictory() {
            gameOver = true;
            document.getElementById('modal-icon').innerText = "🌐";
            document.getElementById('modal-title').innerText = "Parabéns, Criadora!";
            document.getElementById('modal-desc').innerText = "Você evoluiu com sucesso todos os compostos até formar o Planeta Gaia, um mundo repleto de vida!";
            document.getElementById('final-score').innerText = score;
            document.getElementById('modal-gameover').classList.remove('hidden');
        }

        function drawGame() {
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Linha limite superior (perigo de game over)
            ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(0, 70);
            ctx.lineTo(canvas.width, 70);
            ctx.stroke();
            ctx.setLineDash([]);

            // Desenhar bolas no canvas
            balls.forEach(ball => {
                ctx.save();
                ctx.translate(ball.x, ball.y);
                
                // Círculo base com brilho e cor temática
                ctx.beginPath();
                ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(52, 211, 153, 0.6)';
                ctx.stroke();

                // Ícone do elemento
                ctx.font = `${ball.radius * 1.1}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(elements[ball.level].icon, 0, 2);
                
                ctx.restore();
            });

            // Desenhar elemento atual no topo pronto para soltar
            if (currentDrop && !currentDrop.isDropped && !gameOver) {
                ctx.save();
                ctx.translate(currentDrop.x, currentDrop.y);
                ctx.beginPath();
                ctx.arc(0, 0, currentDrop.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.8)';
                ctx.stroke();

                ctx.font = `${currentDrop.radius * 1.1}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(elements[currentDrop.level].icon, 0, 2);
                ctx.restore();

                // Linha guia de queda
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)';
                ctx.beginPath();
                ctx.moveTo(currentDrop.x, currentDrop.y + currentDrop.radius);
                ctx.lineTo(currentDrop.x, canvas.height);
                ctx.stroke();
            }
        }

        function gameLoop() {
            updatePhysics();
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        // Inicialização
        initEvolutionList();
        spawnNextElement();
        createNewDrop(canvas.width / 2);
        gameLoop();
    </script>
</body>
</html>
